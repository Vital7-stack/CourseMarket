{% extends 'base.html' %}

{% block title %}Удаление товара — CourseMarket{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="mb-4">Удаление товара</h1>

    <div class="alert alert-danger">
      Вы уверены, что хотите удалить товар «{{ product.name }}»?
    </div>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Да, удалить</button>
      <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
  </div>
</div>
{% endblock %}
