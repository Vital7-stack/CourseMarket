<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CourseMarket{% endblock %}</title>

    <!-- 1. Подключаем стили Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Базовые стили (твои кастомные) -->
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { background: #333; color: white; padding: 15px 0; }
        footer { background: #333; color: white; text-align: center; padding: 20px; margin-top: 40px; }

        /* Переопределяем цвет ссылок в меню, если нужно, чтобы не были синими */
        header a { color: white; text-decoration: none; margin-right: 15px; }
        header a:hover { text-decoration: underline; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <div class="container">
            {% include "menu.html" %}
        </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>CourseMarket © 2026</p>
    </footer>

    <!-- 2. Подключаем скрипт Bootstrap (в самом низу body) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
